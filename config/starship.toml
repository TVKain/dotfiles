# Starship configuration - minimal for better performance with Catppuccin theme

# Remove blank line before prompt
add_newline = false

# Set Catppuccin Mocha palette
palette = "catppuccin_mocha"

# Username and hostname with Catppuccin colors
[username]
show_always = true
style_user = "bold peach"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold mauve"

[directory]
read_only = " "
read_only_style = ""

# Git configuration - show branch name but disable status symbols
[git_branch]
disabled = false
symbol = ""

[git_commit]
disabled = true

[git_state]
disabled = true

[git_status]
disabled = true

[git_metrics]
disabled = true

# Disable other modules for minimal performance
[aws]
disabled = true

