# Starship configuration - minimal for better performance

# Remove blank line before prompt
add_newline = false

# Username and hostname
[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold dimmed green"

[directory]
read_only = " "
read_only_style = ""

# Git configuration - show branch name but disable status symbols
[git_branch]
disabled = false
symbol = ""

[git_commit]
disabled = true

[git_state]
disabled = true

[git_status]
disabled = true

[git_metrics]
disabled = true

