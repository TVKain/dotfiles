set -g mouse on
set -g history-limit 100000

# Disable automatic window renaming to allow manual names
set-window-option -g automatic-rename off
set-window-option -g allow-rename on

# Automatically renumber windows when one is closed
set -g renumber-windows on

# i3-style keybindings
# Prefix + Enter: new window
bind-key Enter new-window -c "#{pane_current_path}"

# Prefix + Shift+Enter: split horizontal on focused pane
bind-key S-Enter split-window -h -c "#{pane_current_path}"

# Prefix + number: switch to window
bind-key 0 select-window -t:0
bind-key 1 select-window -t:1
bind-key 2 select-window -t:2
bind-key 3 select-window -t:3
bind-key 4 select-window -t:4
bind-key 5 select-window -t:5
bind-key 6 select-window -t:6
bind-key 7 select-window -t:7
bind-key 8 select-window -t:8
bind-key 9 select-window -t:9

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @catppuccin_flavor 'mocha'

# Use window name instead of pane title in status bar
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run '~/.tmux/plugins/tpm/tpm'
