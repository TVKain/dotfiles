set -g mouse on
set -g history-limit 100000

# Scroll mode (copy mode) keybindings
bind-key -n M-q copy-mode

# Vi-style keybindings in copy mode
set -g mode-keys vi

# Custom help popup with common keybindings (Alt+/ to show)
bind-key -n M-/ run-shell 'tmux display-popup -w 90 -h 28 -T "Tmux Keybindings" sh -c "cat << '\''EOF'\''
╔════════════════════════════════════════════════════════════════╗
║                    TMUX KEYBINDINGS                            ║
╚════════════════════════════════════════════════════════════════╝

  NAVIGATION           LAYOUT              SYSTEM
  Alt+h     Left       Alt+s   main-horiz   Alt+Shift+q Close pane
  Alt+j     Down       Alt+Shift+s even-vert   Alt+Shift+e Detach
  Alt+k     Up         Alt+v   main-vert    Alt+Shift+c Reload
  Alt+l     Right      Alt+Shift+v even-horz   Alt+q      Scroll
  Alt+o     Cycle      Alt+t   tiled        Alt+/      Help
  Alt+Shift+h Swap L    Alt+z   zoom
  Alt+Shift+j Swap D    Alt+r   refresh
  Alt+Shift+k Swap U
  Alt+Shift+l Swap R

  WINDOW MGMT
  Alt+x     New pane
  Alt+0-9   Switch window
  Alt+Shift+0-9 Move pane

  Press Esc to close
EOF
"'

# Start windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Disable automatic window renaming to allow manual names
set-window-option -g automatic-rename off
set-window-option -g allow-rename on

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Configure tmux-tilish to remap Alt+Enter to Alt+x (WSL zoom conflict, Windows Alt+Space conflict)
set -g @tilish-remap 'enter=x'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jabirali/tmux-tilish'

set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @catppuccin_flavor 'mocha'

# Use window name instead of pane title in status bar
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run '~/.tmux/plugins/tpm/tpm'
