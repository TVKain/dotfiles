set -g mouse on
set -g history-limit 100000

# Scroll mode (copy mode) keybindings
bind-key -n M-q copy-mode

# Vi-style keybindings in copy mode
set -g mode-keys vi

# Custom help popup with common keybindings (Alt+/ to show)
bind-key -n M-/ display-popup -k -w 50 -h 20 -T "Tmux Keybindings" "cat <<'EOF'
╔════════════════════════════════════════════════════════════════╗
║                    TMUX KEYBINDINGS                            ║
╚════════════════════════════════════════════════════════════════╝

  TMUX-TILISH (i3-style):
  Alt+x       New pane (remapped from Alt+Enter)
  Alt+0-9     Switch window
  Alt+Shift+0-9 Move pane to window
  Alt+h       Move focus left
  Alt+j       Move focus down
  Alt+k       Move focus up
  Alt+l       Move focus right
  Alt+Shift+h Move pane left
  Alt+Shift+j Move pane down
  Alt+Shift+k Move pane up
  Alt+Shift+l Move pane right
  Alt+o       Move focus cyclically
  Alt+Shift+o Move pane cyclically
  Alt+s       Layout: split then vsplit
  Alt+Shift+s Layout: only split
  Alt+v       Layout: vsplit then split
  Alt+Shift+v Layout: only vsplit
  Alt+t       Layout: fully tiled
  Alt+z       Layout: zoom (fullscreen)
  Alt+r       Refresh layout
  Alt+n       Name current workspace
  Alt+Shift+q Close pane
  Alt+Shift+e Detach session
  Alt+Shift+c Reload config
  Alt+/       Show this help

  SCROLL MODE (Alt+q):
  j/k         Scroll down/up
  q           Exit scroll mode

  Press q or Esc to close
EOF
read -sk1"

# Start windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Disable automatic window renaming to allow manual names
set-window-option -g automatic-rename off
set-window-option -g allow-rename on

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Configure tmux-tilish to remap Alt+Enter to Alt+x (WSL zoom conflict, Windows Alt+Space conflict)
set -g @tilish-remap 'enter=x'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jabirali/tmux-tilish'

set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @catppuccin_flavor 'mocha'

# Use window name instead of pane title in status bar
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run '~/.tmux/plugins/tpm/tpm'
