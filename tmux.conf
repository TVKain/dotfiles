set -g mouse on
set -g history-limit 100000

# Fix terminal color trailing when exiting vim
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"

# Enable alternate screen for proper vim behavior
set -g alternate-screen on

# Scroll mode (copy mode) keybindings
bind-key -n M-q copy-mode

# tmux-resurrect keybindings (default)
bind-key C-s run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux save'
bind-key C-r run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux restore'

# Vi-style keybindings in copy mode
set -g mode-keys vi

# Custom help popup with common keybindings (Alt+/ to show)
bind-key -n M-/ run-shell 'tmux display-popup -w 74 -h 16 -T "Tmux Keybindings" sh -c "cat << '\''EOF'\''

   NAVIGATION          WINDOW MANAGEMENT            SYSTEM
   Alt+h       Left    Alt+x         New pane       Alt+Shift+q Close pane
   Alt+j       Down    Alt+0-9       Switch window  Alt+Shift+e Detach
   Alt+k       Up      Alt+Shift+0-9 Move pane      Alt+q Scroll mode
   Alt+l       Right   Ctrl+b Ctrl+s Save session   Alt+/ Show help
   Alt+o       Cycle   Ctrl+b Ctrl+r Restore        Alt+Shift+h Swap L
                                            Alt+Shift+j Swap D
                                            Alt+Shift+k Swap U
                                            Alt+Shift+l Swap R

   Press Esc to close EOF
"'

# Start windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Disable automatic window renaming to allow manual names
set-window-option -g automatic-rename off
set-window-option -g allow-rename on

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Configure tmux-tilish to remap Alt+Enter to Alt+x (WSL zoom conflict, Windows Alt+Space conflict)
set -g @tilish-remap 'enter=x'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'jabirali/tmux-tilish'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor 'mocha'

# Use window name instead of pane title in status bar
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run '~/.tmux/plugins/tpm/tpm'
